name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./airport-board

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: ./airport-board/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test:ci

      - name: Build application
        run: pnpm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: airport-board-next-build
          path: |
            airport-board/.next
            !airport-board/.next/cache
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: Playwright e2e
    needs: quality
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    
    defaults:
      run:
        working-directory: ./airport-board

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: ./airport-board/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: airport-board-next-build
          path: ./airport-board/.next

      - name: Run Playwright tests
        run: pnpm run e2e:ci
