name: Pull Request

on:
  pull_request:
    branches: [main, master, development]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./airport-board

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: ./airport-board/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test:ci

      - name: Build application
        run: pnpm run build
